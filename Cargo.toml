[workspace]
members = [
    "core",
    "server",
    "plugins/invoice",
    "plugins/company"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["TaxTalk Team"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
thiserror = "2.0"
uuid = { version = "1.10.0", features = ["v4"] }
tracing = "0.1.41"
