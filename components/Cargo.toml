[workspace]
resolver = "2"
members = [
    "core",
    "taxtalk-ui",
    "file-upload",
    "dynamic-table",
    "conditional-form",
    "showcase"
]

[workspace.package]
version = "0.1.0"
authors = ["TaxTalk Team"]
edition = "2021"
license = "MIT"

[workspace.dependencies]
leptos = { version = "0.7.0", features = ["csr", "nightly"] }
leptos_meta = "0.7.0"
leptos_router = "0.7.0"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
web-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "js"] }
gloo = "0.11"
gloo-timers = { version = "0.3", features = ["futures"] }

# Internal dependencies
[workspace.dependencies.taxtalk-ui-core]
path = "core"
version = "0.1.0"