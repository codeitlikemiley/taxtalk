[package]
name = "inline-confirmation"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.8", features = ["csr"] }
web-sys = { version = "0.3", features = ["HtmlInputElement", "HtmlElement", "FocusEvent", "KeyboardEvent", "InputEvent"] }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-storage = "0.3"
console_error_panic_hook = "0.1"
regex = "1.10"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "demo"
path = "src/main.rs"
required-features = []