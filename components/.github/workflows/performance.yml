name: Performance Testing

on:
  push:
    branches: [main]
    paths:
      - 'components/**'
  pull_request:
    paths:
      - 'components/**'
  schedule:
    # Run every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'

jobs:
  benchmark:
    name: Performance Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run benchmarks
        run: |
          cd components
          cargo bench --workspace -- --output-format bencher | tee output.txt
      
      - name: Store benchmark result
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Component Benchmarks
          tool: 'cargo'
          output-file-path: components/output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('components/output.txt', 'utf8');
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Performance Benchmark Results\n\`\`\`\n${output}\n\`\`\``
            });

  memory-profile:
    name: Memory Usage Profile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      
      - name: Install valgrind
        run: sudo apt-get update && sudo apt-get install -y valgrind
      
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      
      - name: Build and profile
        run: |
          cd components
          for component in entity-tag token-autocomplete; do
            if [ -d "$component" ]; then
              echo "Profiling $component..."
              cd $component
              wasm-pack build --profiling
              cd ..
            fi
          done
      
      - name: Generate memory report
        run: |
          echo "## Memory Usage Report" >> $GITHUB_STEP_SUMMARY
          echo "| Component | Peak Memory | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----------|------------|---------|" >> $GITHUB_STEP_SUMMARY
          
          # Add memory profiling results here
          echo "Memory profiling complete" >> $GITHUB_STEP_SUMMARY