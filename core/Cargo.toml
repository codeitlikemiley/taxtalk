[package]
name = "taxtalk_core"
version = "0.1.0"
edition = "2024"

[dependencies]
# WASM Runtime - REQUIRED
wasmtime = "36.0.2"

# Serialization - REQUIRED
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_with = "3"

# Async runtime - REQUIRED
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread", "fs", "signal"] }

# Parsing & Tokenization - REQUIRED
nom = "8.0.0"
tokenizers = "0.22.0"

# Error handling - REQUIRED
thiserror = "2.0"

# Logging - REQUIRED
tracing = "0.1.41"
tracing-subscriber = "0.3.20"

# Utilities - REQUIRED
async-trait = "0.1.81"
uuid = { version = "1.10.0", features = ["v4", "serde"] }
notify = "8.2.0"
chrono = { version = "0.4", features = ["serde"] }
wasmtime-wasi = "36.0.2"

# Optional
# Decimal support for financial calculations
rust_decimal = { version = "1.35", features = ["serde"] }
sqlx = { version = "0.8.2", features = ["sqlite", "runtime-tokio-rustls", "macros"] }

[dev-dependencies]
tempfile = "3.13"
tokio-test = "0.4"