[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
# Web server - REQUIRED
axum = { workspace = true, features = ["json", "ws", "multipart"] }
tower = "0.5.1"

# Async runtime - REQUIRED (must match core version)
tokio = { version = "1.47.1", features = ["macros", "rt-multi-thread"] }

# Serialization - REQUIRED (must match core versions)
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"

# Logging - REQUIRED (must match core versions)
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }

# Core dependency - REQUIRED
taxtalk_core = { path = "../core" }

# Additional dependencies for WebSocket and chat
uuid = { version = "1.10.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tower-http = { version = "0.6.6", features = ["cors"] }
anyhow = "1.0"

[dev-dependencies]
axum-test = "15.7.1"
tokio = { version = "1.47.1", features = ["test-util"] }
tempfile = "3.8"